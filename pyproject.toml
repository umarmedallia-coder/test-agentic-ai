[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "test-agentic-ai"
version = "0.1.0"
description = "Local paper-trading-first NSE/BSE engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8,<3", "pydantic-settings>=2.4,<3", "streamlit>=1.38,<2", "pandas>=2.2,<3", "numpy>=2.0,<3", "langgraph>=0.2,<2"]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
